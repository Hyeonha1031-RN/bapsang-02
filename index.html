<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 밥상</title>
  <style>
    :root {
      --bg: #f6ecdc;          /* 한지 느낌 바탕 */
      --ink: #4a2f1d;         /* 진한 갈색 글씨 */
      --accent: #b5462f;      /* 고추장 빨강 */
      --wood-light: #c98a52;  /* 상판 밝은 나무색 */
      --wood-dark: #8a5530;   /* 상판 테두리 */
      --card: #fffaf1;        /* 그릇 카드 */
      --card-edge: #e8d6bb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 32px 16px;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.5), transparent 40%),
        var(--bg);
      color: var(--ink);
      font-family: "Nanum Myeongjo", "Batang", "AppleMyungjo", serif;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 44px);
      letter-spacing: .12em;
    }
    h1::after {
      content: "";
      display: block;
      width: 48px;
      height: 3px;
      margin: 10px auto 0;
      background: var(--accent);
      border-radius: 2px;
    }

    /* 둥근 상 */
    .table {
      width: min(90vw, 560px);
      aspect-ratio: 1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12%;
      background:
        repeating-radial-gradient(circle at 50% 50%,
          rgba(0,0,0,0) 0 14px, rgba(90,50,20,.07) 15px 16px),
        radial-gradient(circle at 40% 35%, #dca06a, var(--wood-light) 55%, #b4743f);
      border: 14px solid var(--wood-dark);
      box-shadow:
        inset 0 0 30px rgba(60,30,10,.35),
        0 18px 0 -4px #6b3f22,
        0 30px 40px rgba(60,30,10,.35);
    }

    /* 반찬 목록 = 카드들 */
    .dishes {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      gap: 14px;
    }

    .dishes li {
      width: clamp(76px, 20vw, 104px);
      padding: 14px 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--card-edge);
      border-radius: 18px;
      box-shadow: 0 6px 12px rgba(60,30,10,.25);
      font-size: clamp(14px, 3.6vw, 17px);
      font-weight: bold;
      transition: transform .2s;
    }
    .dishes li:hover { transform: translateY(-4px) rotate(-2deg); }

    /* data-emoji 값을 이모지로 표시 */
    .dishes li::before {
      content: attr(data-emoji);
      font-size: clamp(30px, 8vw, 42px);
      line-height: 1;
    }

    footer {
      font-size: 14px;
      opacity: .7;
    }
  </style>
</head>
<body>
  <h1>오늘의 밥상</h1>

  <div class="table">
    <ul class="dishes">
      <!--
        반찬을 추가하려면 아래에 한 줄씩 쓰면 돼요.
        형식: <li data-emoji="이모지">이름</li>
        예시: <li data-emoji="🥚">계란말이</li>
      -->
      <li data-emoji="🍚">밥</li>
      <li data-emoji="🍲">국</li>
      <li data-emoji="🌶️">김치</li>
      <li data-emoji="🍖">돈까스</li>
      <li data-emoji="🥩">양갈비</li>
    </ul>
  </div>

  <footer>맛있게 드세요 🥢</footer>
</body>
</html>
